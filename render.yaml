# ═══════════════════════════════════════════════════════════════════════════
# render.yaml — Render.com Blueprint (free tier)
# Deploy with: connect GitHub repo → Render auto-detects this file
# ═══════════════════════════════════════════════════════════════════════════

services:
  # ── Backend API (Free Web Service) ─────────────────────────────────────
  - type: web
    name: finsight-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_api.py --workers 1 --log-level warning --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FINSIGHT_API_KEY
        sync: false  # prompts you to set it in Render dashboard
      - key: FINSIGHT_DISABLE_AUTH
        value: "false"
      - key: FINSIGHT_HOST
        value: "0.0.0.0"
      - key: FINSIGHT_DEBUG
        value: "false"
      - key: FINSIGHT_SUPABASE_URL
        sync: false
      - key: FINSIGHT_SUPABASE_ANON_KEY
        sync: false
      - key: FINSIGHT_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FINSIGHT_SUPABASE_JWT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false

  # ── Frontend (Free Static Site) ────────────────────────────────────────
  - type: web
    name: finsight-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://finsight-backend.onrender.com/api/v1
      - key: VITE_API_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
