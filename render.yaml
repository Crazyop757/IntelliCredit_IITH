# ═══════════════════════════════════════════════════════════════════════════
# render.yaml — Render.com Blueprint (free tier)
# Deploy with: connect GitHub repo → Render auto-detects this file
# ═══════════════════════════════════════════════════════════════════════════

services:
  # ── Backend API (Free Web Service) ─────────────────────────────────────
  - type: web
    name: intelli-credit-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_api.py --workers 1 --log-level warning --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: INTELLI_API_KEY
        sync: false  # prompts you to set it in Render dashboard
      - key: INTELLI_DISABLE_AUTH
        value: "false"
      - key: INTELLI_HOST
        value: "0.0.0.0"
      - key: INTELLI_DEBUG
        value: "false"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false

  # ── Frontend (Free Static Site) ────────────────────────────────────────
  - type: web
    name: intelli-credit-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://intelli-credit-api.onrender.com/api/v1
      - key: VITE_API_KEY
        sync: false
